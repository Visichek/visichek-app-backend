# Test infrastructure: MongoDB + Redis for local integration testing.
# Usage: docker-compose -f docker-compose.test.yml up -d
#        make test-integration
#        docker-compose -f docker-compose.test.yml down

services:
  test-mongodb:
    image: mongo:6.0
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db  # RAM-backed for speed, data discarded on stop

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --save ""  # No persistence for tests
