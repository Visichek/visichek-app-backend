# Depends on the shared stack in ../docker-compose.shared.yml (redis + flower).
# Start that first:
#   docker network create visichek-shared   # one-time
#   docker-compose -f ../docker-compose.shared.yml up -d

services:
  web:
    build: .
    command: fastapi run main.py --host 0.0.0.0 --port 7861  --workers 5
    ports:
      - "7861:7861"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    networks:
      - visichek-shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: celery -A celery_worker worker -l info --pool=custom --concurrency=5
    env_file:
      - .env
    environment:
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    networks:
      - visichek-shared

networks:
  visichek-shared:
    external: true
